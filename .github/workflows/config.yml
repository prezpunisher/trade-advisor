name: Automated Config

# Jobs for Daybook's Automated Config page. The page's buttons open prefilled issues; only issues the repo owner opens
# run (anyone else's are ignored). "Backtest config: <name>" replays a draft on 2 years of real option prices;
# "Make live: backtest #N" turns a finished backtest into strategy.json, which the bot reads every morning.
# Never trades. The Massive key comes only from the MASSIVE_API_KEY repo secret and is never printed.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: config-jobs

jobs:
  config:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (startsWith(github.event.issue.title, 'Backtest config') || startsWith(github.event.issue.title, 'Make live: backtest #'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/daybook
          path: daybook
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r daybook/requirements.txt
      - name: Check the Massive key
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          if [ -z "$MASSIVE_API_KEY" ]; then
            echo "The MASSIVE_API_KEY repo secret is missing; backtests need it." > comment.md
            exit 1
          fi
      - name: Restore downloaded prices
        uses: actions/cache@v4
        with:
          path: massive_cache
          key: massive-${{ github.run_id }}
          restore-keys: massive-
      - name: Run the job
        env:
          DAYBOOK_DIR: daybook
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python config_jobs.py
      - name: Save
        run: |
          git config user.name "config-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtests strategy.json docs/cheap.json
          git diff --cached --quiet || git commit -q -m "config: issue #${{ github.event.issue.number }}"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && break
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
      - name: Reply and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s comment.md ] || echo "The job failed before it could finish. Log: $RUN_URL" > comment.md
          gh issue comment ${{ github.event.issue.number }} --body-file comment.md
          gh issue close ${{ github.event.issue.number }}
